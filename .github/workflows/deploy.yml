name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate wrangler.toml from Secrets and Envs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          ANALYTICS_DATASET: ${{ vars.ANALYTICS_DATASET || 'LINK_REDIRECT_ANALYTICS' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DEFAULT_FALLBACK_URL: ${{ vars.DEFAULT_FALLBACK_URL }}
          SITE_NAME: ${{ vars.SITE_NAME || 'Link Redirect Gateway' }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'cf-link-redirect' }}
        run: |
          npm run generate-wrangler

      - name: Type Check
        run: npm run build

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
